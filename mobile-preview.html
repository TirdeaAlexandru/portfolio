<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f1efec">
  <title>Mobile preview — Alexandru Țîrdea</title>
  <style>
    * { box-sizing: border-box; }
    body { min-height: 100svh; margin: 0; padding: 22px 14px; display: grid; place-items: center; background: #f1efec; color: #242424; font: 14px/1.5 Arial, sans-serif; }
    main { width: 100%; display: grid; justify-items: center; gap: 12px; }
    p { margin: 0; color: #69645e; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
    .phone { width: min(390px, calc(100vw - 24px)); height: min(844px, calc(100svh - 76px)); min-height: 520px; overflow: hidden; border: 1px solid #c9c5be; border-radius: 18px; background: #191a1c; box-shadow: 0 18px 56px rgba(25, 24, 22, .18); }
    iframe { display: block; width: 100%; height: 100%; border: 0; pointer-events: none; }
    @media (max-width: 430px) { body { padding: 10px 0; } .phone { width: 100vw; height: calc(100svh - 42px); min-height: 440px; border-right: 0; border-left: 0; border-radius: 0; box-shadow: none; } p { margin-bottom: 2px; } }
  </style>
</head>
<body>
  <main>
    <p>Mobile preview · View only</p>
    <div class="phone">
      <iframe id="portfolio-preview" title="Read-only mobile preview of the portfolio" src="index.html?mobile-preview=1"></iframe>
    </div>
  </main>
  <script>
    const preview = document.getElementById("portfolio-preview");
    preview.addEventListener("load", function () {
      try {
        const page = preview.contentDocument;
        page.body.classList.add("nav-open");
        const toggle = page.querySelector(".menu-toggle");
        if (toggle) toggle.setAttribute("aria-expanded", "true");
      } catch (_) {}
    });
  </script>
</body>
</html>
